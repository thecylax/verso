name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_stable: ${{ steps.semver.outputs.is_stable }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate unified SemVer
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          API_VERSION=$(python -c "import tomllib; print(tomllib.load(open('apps/api/pyproject.toml','rb'))['project']['version'])")
          WEB_VERSION=$(python -c "import json; print(json.load(open('apps/web/package.json'))['version'])")

          if [[ "$API_VERSION" != "$WEB_VERSION" ]]; then
            echo "API and web versions differ: $API_VERSION != $WEB_VERSION" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "Invalid release tag: $TAG" >&2
              echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-(alpha|beta|rc).N" >&2
              exit 1
            fi

            if [[ "$VERSION" != "$API_VERSION" ]]; then
              echo "Release tag $TAG does not match project version $API_VERSION" >&2
              exit 1
            fi

            if [[ "$VERSION" == *-* ]]; then
              echo "is_stable=false" >> "$GITHUB_OUTPUT"
            else
              echo "is_stable=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated Verso version $API_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run API tests
        run: python -m pytest
        working-directory: apps/api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Check web app
        run: pnpm check
        working-directory: apps/web

      - name: Run web tests
        run: pnpm test
        working-directory: apps/web

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            target: ""
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            target: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/verso-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ needs.test.outputs.is_stable == 'true' && github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Sign published image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
