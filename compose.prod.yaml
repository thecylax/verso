name: verso-production

networks:
  portainer_default:
    external: true

services:
  api:
    image: ghcr.io/thecylax/verso-api:latest
    container_name: verso_api
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - portainer_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in the production .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BIBLE_API_BASE_URL: ${BIBLE_API_BASE_URL:-https://abibliadigital.api.br/api}
      BIBLE_API_TOKEN: ${BIBLE_API_TOKEN:-}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}

  verso_web:
    image: ghcr.io/thecylax/verso-web:latest
    container_name: verso_web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - portainer_default
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=portainer_default

      - traefik.http.routers.verso.rule=Host(`${VERSO_DOMAIN:-verso.blacktomato.vps-kinghost.net}`)
      - traefik.http.routers.verso.entrypoints=${TRAEFIK_WEBSECURE_ENTRYPOINT:-websecure}
      - traefik.http.routers.verso.tls=true
      - traefik.http.routers.verso.tls.certresolver=${TRAEFIK_CERTRESOLVER:-leresolver}
      - traefik.http.routers.verso.service=verso
      - traefik.http.services.verso.loadbalancer.server.port=80
      - traefik.http.routers.verso.tls.domains[0].main=${VERSO_DOMAIN:-verso.blacktomato.vps-kinghost.net}
