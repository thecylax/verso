name: verso-production

networks:
  portainer_default:
  traefik:
    external: true

services:
  api:
    image: ghcr.io/thecylax/verso-api:latest
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - portainer_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: ghcr.io/thecylax/verso-web:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - portainer_default
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true

      - traefik.http.routers.verso.rule=Host(`${VERSO_DOMAIN:-verso.blacktomato.vps-kinghost.net}`)
      - traefik.http.routers.verso.entrypoints=${TRAEFIK_WEBSECURE_ENTRYPOINT:-websecure}
      - traefik.http.routers.verso.tls=true
      - traefik.http.routers.verso.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.verso.loadbalancer.server.port=80

      - traefik.http.routers.verso-http.rule=Host(`${VERSO_DOMAIN:-verso.blacktomato.vps-kinghost.net}`)
      - traefik.http.routers.verso-http.entrypoints=${TRAEFIK_WEB_ENTRYPOINT:-web}
      - traefik.http.routers.verso-http.middlewares=verso-redirect
      - traefik.http.middlewares.verso-redirect.redirectscheme.scheme=https
